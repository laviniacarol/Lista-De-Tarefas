<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tarefas JS</title>
</head>
<body>
    <main>
        <h1>Lista de Tarefas</h1>
        <section id="create-todo-section">
            <form id="create-todo-form">
                <input 
                type="text" 
                id="description" 
                name="description" 
                class="input-description"
                aria-label="Qual tarefa deseja cadastrar?"
                placeholder="Qual tarefa deseja cadastrar?"
                />
                <button type="submit" aria-label="Cadastrar tarefa" class="add-task-btn">+</button>
            </form>
        </section>
        <section class="todo-list-section">
            <ul id="todo-list"></ul>
        </section>
    <footer>
        <button onclick="removeDoneTasks()" class="remove-done-tasks-btn">
            Remover tarefas concluídas.
        </button>
    </footer>

    </main>
    
    <script src="index.js"></script>

</body>
</html>
